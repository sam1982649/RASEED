<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحويل رصيد</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .download-bar {
            background: #4CAF50;
            padding: 15px 25px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        .download-btn {
            background: white;
            color: #4CAF50;
            padding: 10px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
        }
        .download-btn:hover {
            background: #f0f0f0;
        }
        .header {
            text-align: center;
            padding: 30px 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .header h1 { font-size: 2.8em; margin-bottom: 10px; }
        .header p { opacity: 0.8; font-size: 1.1em; }
        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 25px 0;
        }
        .feature {
            background: rgba(255,255,255,0.05);
            padding: 25px 15px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .feature span { font-size: 2.5em; display: block; margin-bottom: 10px; }
        .feature h3 { margin-bottom: 8px; color: #4CAF50; }
        .feature p { opacity: 0.8; font-size: 0.9em; }
        .footer { text-align: center; padding: 20px; opacity: 0.7; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="download-bar">
            <span>📱 تحويل رصيد</span>
            <a href="https://tinyurl.com/Syriatell" class="download-btn">⬇️ تحميل</a>
        </div>
        
        <div class="header">
            <h1>💰 تحويل رصيد</h1>
            <p>تطبيق بسيط لإدارة التحويلات والمدفوعات اليومية</p>
        </div>
        
        <div class="features">
            <div class="feature">
                <span>💸</span>
                <h3>تحويل سريع</h3>
                <p>بنقرة واحدة</p>
            </div>
            <div class="feature">
                <span>📊</span>
                <h3>تتبع الرصيد</h3>
                <p>محفظة بسيطة</p>
            </div>
            <div class="feature">
                <span>📋</span>
                <h3>سجل المدفوعات</h3>
                <p>متابعة العمليات</p>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2024 تحويل رصيد</p>
        </div>
        
    </div>
</body>
</html>
